<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="luxury-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  
  <!-- Specular Glassmorphic Backing Shield -->
  <path fill="url(#glass-shine)" d="M12 2a2 2 0 0 1 1.41.59l8 8a2 2 0 0 1 0 2.82l-8 8a2 2 0 0 1-2.82 0l-8-8a2 2 0 0 1 0-2.82l8-8A2 2 0 0 1 12 2z" stroke="url(#luxury-purple)" stroke-width="1.2" />
  
  <!-- Target/Focus Brackets for "Scan" Hud -->
  <path d="M5 2 H2 V5" stroke="url(#neon-cyan)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M19 2 H22 V5" stroke="url(#neon-cyan)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M5 22 H2 V19" stroke="url(#neon-cyan)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M19 22 H22 V19" stroke="url(#neon-cyan)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- The "B" Open Manga Book Structure -->
  <path d="M12.5 5C7.5 5 5.5 7 5.5 12c0 5 2 7 7 7" stroke="url(#luxury-purple)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M12.5 5c4 0 6 1.5 6 4.5S15.5 12 12.5 12c4 0 6 1.5 6 4.5S15.5 19 12.5 19" stroke="url(#luxury-purple)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Sleek Dynamic "S" Cyber Scan Ribbon -->
  <path d="M16 6.5a3.5 3.5 0 0 0-3.5-3c-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5 4.5 2 4.5 4.5-2 4.5-4.5 4.5a3.5 3.5 0 0 1-3.5-3" stroke="url(#neon-cyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  
  <!-- Center Scan Portal & Lens -->
  <circle cx="12.5" cy="12" r="2.5" fill="none" stroke="url(#neon-cyan)" stroke-width="1.5" />
  <circle cx="12.5" cy="12" r="1" fill="url(#neon-cyan)" stroke="none" />
  
  <!-- Glowing Laser horizontal Scanning Line -->
  <line x1="2" y1="12" x2="22" y2="12" stroke="url(#neon-cyan)" stroke-dasharray="1 3" stroke-width="1.8" opacity="0.75" />
</svg>
