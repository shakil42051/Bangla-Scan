<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="Read manga, manhwa, manhua and comics in Bangla. Discover new series, follow chapter updates, and build your personal collection.">
  <meta name="api-base" content="/api">
  <title>Bangla Scan — Manga, Manhwa, Manhua & Comics</title>
  <link rel="icon" href="/bangla_scan_logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/home"><span class="brand-mark">ব</span><span>bangla<span class="brand-accent">scan</span><small>YOUR MANGA UNIVERSE</small></span></a>

      <nav id="desktop-nav"></nav>
      <button class="random-series" data-action="random"><span data-icon="shuffle"></span><span>Surprise me<small>Discover a random series</small></span><span aria-hidden="true">↗</span></button>
      <div class="sidebar-bottom"><a href="#/settings" class="nav-link" id="settings-link"></a><div id="account-summary"></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a href="#/home" class="mobile-brand" aria-label="Bangla Scan home"><span class="brand-mark">ব</span>banglascan</a>
        <form class="global-search" role="search" id="search-form"><span data-icon="search"></span><input name="q" type="search" aria-label="Search manga titles and creators" placeholder="Search manga, manhwa, manhua…" maxlength="150"><kbd>/</kbd></form>
        <div class="topbar-actions"><a class="icon-button notification-button" href="#/notifications" aria-label="Notifications"><span data-icon="bell"></span><span id="notification-count" hidden></span></a><button class="icon-button" data-action="theme" aria-label="Switch color theme" title="Switch color theme"><span data-icon="sun"></span></button><div id="account-action"></div></div>
      </header>
      <div id="connection-banner" class="connection-banner" role="status" hidden></div>
      <aside id="site-announcement" class="broadcast" aria-label="Site announcement" hidden></aside>
      <main id="main" tabindex="-1" aria-busy="true"><div class="page-loading" role="status">Loading manga and comics…</div></main>
      <footer class="site-footer"><a class="footer-brand" href="#/home">banglascan<span>✦</span></a><span id="footer-tagline">Manga. Manhwa. Manhua. Comics.</span><span lang="bn">আপনার মাঙ্গা, আপনার ভাষায়।</span></footer>
    </div>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  <dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="empty-state">Please enable JavaScript to browse and read Bangla Scan.</p></noscript>
</body>
</html>
